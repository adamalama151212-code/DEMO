# =============================================================================
# Databricks Asset Bundle — SKELETON (deployed in stage E9 of PLAN_SMOG.md).
#
# Every pipeline step is its own wheel (decision D14): one artifact per package,
# and each Job task installs smogcast-core plus the wheel of its step.
# `--env dev|prod` selects the configuration (Unity Catalog + volume instead of the
# local `data/` directory), so transformation code does not change.
#
# Before the first `databricks bundle deploy` (docs/poprawki-przed-deployem.md):
#   1. fill in `workspace.host` of the target (the only values the code cannot know),
#   2. run sql/bootstrap_uc.sql on that workspace (catalog, schemas, volumes),
#   3. PROD only: fill in the service principal in `run_as` — PROD is deployed by CI
#      logged in as that principal.
# Identity: Jobs run on single-user clusters owned by ${workspace.current_user.userName},
# i.e. the deployer on DEV and the service principal on PROD (resources/job_*.yml).
# =============================================================================
bundle:
  name: smogcast

include:
  - resources/*.yml

# What lands in <bundle>/files on the workspace. Jobs need none of it — they install the wheels from
# `artifacts`, uploaded separately — so only the SQL scripts go up, not the whole repository (plans,
# docs, Docker files). Add a path here when a resource needs source files
# (e.g. the Databricks App or a declarative pipeline in E9).
sync:
  paths:
    - sql

artifacts:
  core:
    type: whl
    path: ./packages/core
    build: python -m build --wheel
  ingest:
    type: whl
    path: ./packages/ingest
    build: python -m build --wheel
  bronze:
    type: whl
    path: ./packages/bronze
    build: python -m build --wheel
  silver_clean:
    type: whl
    path: ./packages/silver_clean
    build: python -m build --wheel
  silver_transform:
    type: whl
    path: ./packages/silver_transform
    build: python -m build --wheel
  model:
    type: whl
    path: ./packages/model
    build: python -m build --wheel
  gold:
    type: whl
    path: ./packages/gold
    build: python -m build --wheel
  # No `app` artifact: no Job runs smogcast-app. The dashboard/assistant is hosted outside the Jobs
  # (planned: Azure, reading gold through a SQL Warehouse) and is deployed by its own route.

variables:
  env:
    description: "smogcast configuration environment (dev | prod)"
    default: dev
  node_type:
    # Set per target: DEV and PROD are workspaces on different Azure accounts, and VM availability depends
    # on the region and the subscription's per-family vCPU quota.
    description: "Azure VM type of the single-node Job clusters"

targets:
  dev:
    # development mode: resources get a "[dev <user>]" prefix and schedules are paused, Jobs run as
    # the person who deploys — a first deploy from a laptop is fine here.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617820175624.4.azuredatabricks.net   # DEV workspace (workspace id 7405617820175624)
    variables:
      env: dev
      # DC4as_v5 (4 vCPU, 16 GB): the course cluster of this workspace runs on it, so it has capacity and quota
      # in Germany West Central; D4ds_v5 failed there with CLOUD_PROVIDER_RESOURCE_STOCKOUT (2026-10-06).
      node_type: Standard_DC4as_v5

  prod:
    # mode: production — the bundle refuses deploys from a laptop with uncommitted changes;
    # PROD is deployed ONLY by CI.
    mode: production
    workspace:
      host: https://adb-YYYYYYYYYYYYYYY.Y.azuredatabricks.net   # TODO: PROD workspace URL
    # Jobs on PROD run as a service principal, never as the person who happened to deploy.
    run_as:
      service_principal_name: 00000000-0000-0000-0000-000000000000   # TODO: application (client) id of the SP
    variables:
      env: prod
      node_type: Standard_DC4as_v5   # TODO: check what the course's PROD workspace offers (region, quota)

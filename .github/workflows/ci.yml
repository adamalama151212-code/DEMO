# =============================================================================
# CI: lint + testy jednostkowe i DQ na każdym PR (plan 4.9).
#
# Kolejne kroki z planu (bundle validate → deploy DEV → deploy PROD) dojdą
# w bloku 3, gdy będzie workspace i service principal z OIDC.
# =============================================================================
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Spark 4 wymaga Java 17+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalacja
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      # Cache jarów Delta (Ivy) — oszczędza pobieranie z Maven Central przy każdym przebiegu
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-delta-4.0-${{ hashFiles('pyproject.toml') }}

      - name: Testy (fizyka, meteo, DQ czujników, CDC, guardrails, idempotencja)
        env:
          TZ: UTC
        run: pytest -q
